#
# The application: the LiteRT for Microcontrollers "Hello World" runner. The
# AI layer (generated by create_ai_layer.py) brings the kernels and the model
# data; the Board layer brings the board bring-up, STDOUT and, for an Ethos-U
# target, the driver and its initialisation.
project:
  description: LiteRT for Microcontrollers Hello World

  packs:
    - pack: ARM::CMSIS

  # What a board layer has to provide for this application. A layer for an
  # Ethos-U target must also select the Ethos-U driver and initialise the NPU
  # before app_main() (see board/Corstone-320/ethos_setup.c).
  connections:
    - connect: LiteRT Hello World
      consumes:
        - STDOUT
        - Heap: 65536

  misc:
    - for-compiler: GCC
      C:
        - -Wno-psabi
      CPP:
        - -Wno-psabi
      Link:
        - -Wl,-u,_printf_float

  groups:
    - group: App
      files:
        - file: ./Source/hello_world_test.cpp

  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: ./Model/model.clayer.yml
      type: AI

  output:
    type:
      - elf
      - hex
      - map
