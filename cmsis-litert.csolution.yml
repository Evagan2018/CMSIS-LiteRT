#
# TensorFlow Lite Micro "Hello World" (sine model) on the Ethos-U85 of the
# Corstone-320 (SSE-320) FVP. Three steps build it:
#
#   cbuild setup cmsis-litert.csolution.yml --active SSE-320-U85
#   python create_ai_layer.py cmsis-litert.cbuild-mlops.yml
#   cbuild cmsis-litert.csolution.yml --active SSE-320-U85
#
# The `mlops:` node below makes `cbuild setup` emit the *.cbuild-mlops.yml;
# create_ai_layer.py reads the NPU and Vela settings from it, compiles the
# committed int8 model with Vela and writes the AI layer (Model/).
solution:
  created-for: CMSIS-Toolbox@2.14.1
  cdefault:
  compiler: AC6

  packs:
    - pack: tensorflow::tensorflow-lite-micro@1.26.2
    - pack: tensorflow::flatbuffers@1.26.2
    - pack: tensorflow::gemmlowp@1.26.2
    - pack: tensorflow::kissfft@1.26.2
    - pack: tensorflow::ruy@1.26.2
    - pack: ARM::ethos-u-core-driver@1.26.2
    - pack: ARM::CMSIS-NN@8.0.0
    - pack: ARM::CMSIS
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: ARM::SSE_320_BSP@1.0.0

  target-types:
    # Corstone-320 with an Ethos-U85 NPU, simulated on the Arm FVP.
    - type: SSE-320-U85
      board: SSE-320
      device: SSE-320-FVP
      variables:
        - Board-Layer: $SolutionDir()$/board/Corstone-320/Board-U85.clayer.yml
      target-set:
        - set:
          images:
            - project-context: cmsis-litert.Debug
          debugger:
            name: Arm-FVP
            # The model is its own GDB server (plugins/GDBServer.so, MDK FVP
            # models 11.32.23+). fvp.sh resolves that plugin when VS Code was
            # not started from a `vcpkg activate` shell, line-buffers the
            # model's stdout so the debug adapter sees the "Listening" banner,
            # and on macOS runs the model in Docker (Arm ships no macOS build).
            # On Windows point this straight at FVP_Corstone_SSE-320.exe.
            model: ${workspaceFolder}/.vscode/fvp.sh
            config-file: board/Corstone-320/fvp_config.txt
            args: "--simlimit 60"

  build-types:
    - type: Debug
      debug: on
      optimize: debug

  projects:
    - project: ./cmsis-litert.cproject.yml

  # MLOps information: exported to cmsis-litert.cbuild-mlops.yml by
  # `cbuild setup ... --active SSE-320-U85`, from where create_ai_layer.py
  # reads it. Retarget the NPU here and re-run the three steps.
  # https://open-cmsis-pack.github.io/cmsis-toolbox/build-overview/#mlops-information
  #
  # Needs CMSIS-Toolbox 2.14.1+p88 or newer (Keil Studio csolution extension
  # 1.70.1 or newer): the simulator target is detected from the Arm-FVP
  # target-set, and the extra keys under model: are passed through to
  # create_ai_layer.py. Older toolboxes reject the extra keys.
  mlops:
    description: Hello World sine model for Ethos-U85
    npu:
      type: Ethos-U85
      # The SSE-320 BSP declares no NPU features, so the MAC count has to be
      # given here. It must match mps4_board.subsystem.ethosu.num_macs in
      # board/Corstone-320/fvp_config.txt.
      macs: 256
    vela:
      system: Ethos_U85_SYS_DRAM_Mid # system-config from the Vela config
      memory: Shared_Sram # memory-mode from the Vela config
    model:
      clayer: ./Model/model.clayer.yml
      name: HelloWorld
      # Model parameters for create_ai_layer.py: the trained models, relative
      # to the layer directory, and the delta the test accepts.
      int8-model: model_int8.tflite
      float-model: model_float.tflite
