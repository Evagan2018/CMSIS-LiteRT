# Generated by create_ai_layer.py from cmsis-tflm-simple.cbuild-mlops.yml -- do not edit.
# Re-run `python create_ai_layer.py` after retraining the model or changing
# the csolution's mlops: node.
layer:
  type: AI
  description: Hello World sine model for Ethos-U85

  packs:
    - pack: tensorflow::tensorflow-lite-micro
    - pack: tensorflow::flatbuffers
    - pack: tensorflow::gemmlowp
    - pack: tensorflow::kissfft
    - pack: tensorflow::ruy

  define:
    # CMSIS-NN 8.0.0 compiles its float kernels only with these set, but
    # its NN Lib component lists the sources unconditionally.
    - ARM_NN_ENABLE_F32: 1
    - ARM_NN_ENABLE_F16: 1

  components:
    - component: tensorflow::Data Exchange:Serialization:flatbuffers
    - component: tensorflow::Data Processing:Math:gemmlowp fixed-point
    - component: tensorflow::Data Processing:Math:kissfft
    - component: tensorflow::Data Processing:Math:ruy
    - component: tensorflow::Machine Learning:TensorFlow:Kernel&Ethos-U
    - component: tensorflow::Machine Learning:TensorFlow:Kernel Utils
    # Both kernel variants compile the CMSIS-NN kernels; the Ethos-U one
    # does not declare the dependency, so select the library explicitly.
    - component: ARM::CMSIS:NN Lib

  groups:
    - group: HelloWorld
      files:
        - file: ./model_int8.c
        - file: ./model_float.c
