#
# The application: the TensorFlow Lite Micro "Hello World" runner. The AI
# layer (generated by create_ai_layer.py) brings the TFLM kernels and the
# model data; the Board layer brings the board bring-up and the Ethos-U driver.
project:
  packs:
    - pack: ARM::CMSIS

  misc:
    - for-compiler: GCC
      C:
        - -Wno-psabi
      CPP:
        - -Wno-psabi
      Link:
        - -Wl,-u,_printf_float

  groups:
    - group: App
      files:
        - file: ./Source/hello_world_test.cpp

  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: ./Model/model.clayer.yml
      type: AI

  output:
    type:
      - elf
      - hex
      - map
