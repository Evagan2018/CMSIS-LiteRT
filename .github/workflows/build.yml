#
# The three-step build (cbuild setup, create_ai_layer.py, cbuild) followed by
# an FVP run, with each of the three toolchains, plus a cross-platform check
# of the Python side.
name: Build and Run

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SOLUTION: cmsis-litert
  TARGET: SSE-320-U85

jobs:
  # Full build plus an FVP run, once per toolchain. Linux only: the FVP needs
  # an Arm user-based license, so matrixing this across hosts is not cheap.
  build-and-run:
    name: Build and run on Corstone-320 (${{ matrix.toolchain }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        toolchain: [AC6, GCC, CLANG]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install tools
        uses: ARM-software/cmsis-actions/vcpkg@v1

      # --------------------------------------------------------------
      # S T A R T  T O O L  I N J E C T I O N 
  
      # CMSIS_TOOLBOX_TOKEN must have Actions: Read permission for
      # Open-CMSIS-Pack/cmsis-toolbox.
      - name: Download nightly CMSIS-Toolbox
        uses: actions/download-artifact@v8
        with:
          artifact-ids: "10617505098"
          repository: Open-CMSIS-Pack/cmsis-toolbox
          run-id: "35547518158"
          github-token: ${{ secrets.CMSIS_TOOLBOX_TOKEN }}
          path: ${{ runner.temp }}/cmsis-toolbox-nightly
  
      - name: Override CMSIS-Toolbox with nightly version
        shell: bash
        run: |
          set -euo pipefail
  
          TOOLBOX_BIN="${RUNNER_TEMP}/cmsis-toolbox-nightly/bin"
  
          test -x "${TOOLBOX_BIN}/cbuild" ||
            chmod -R +x "${TOOLBOX_BIN}"
  
          # Entries written to GITHUB_PATH are prepended to PATH for all
          # following steps, overriding the version activated by vcpkg.
          echo "${TOOLBOX_BIN}" >> "${GITHUB_PATH}"
  
      # D I A G N O S I S
      - name: Verify nightly CMSIS-Toolbox
        shell: bash
        run: |
          set -euo pipefail
  
          EXPECTED_BIN="${RUNNER_TEMP}/cmsis-toolbox-nightly/bin"
          ACTUAL_CBUILD="$(command -v cbuild)"
  
          case "${ACTUAL_CBUILD}" in
            "${EXPECTED_BIN}/"*) ;;
            *)
              echo "::error::Unexpected cbuild selected: ${ACTUAL_CBUILD}"
              exit 1
              ;;
          esac
  
          echo "Using cbuild: ${ACTUAL_CBUILD}"
          cbuild --version
  
      # E N D  T O O L  I N J E C T I O N 
      # --------------------------------------------------------------

      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      # --------------------------------------------------------------
      # Add pack
      - name: Add CS2320_Pack_200.pack.
        working-directory: ./Patch
        run: |
          cpackget add ARM.SSE_320_BSP.2.0.0.pack --agree-embedded-license

      # --------------------------------------------------------------


      # The FVP loads the runner's libpython3.11, whose standard library is
      # not where that build's prefix says; the model then dies at start-up
      # with "Fatal Python error: init_fs_encoding". PYTHONHOME (set on the
      # FVP step only) points it at a complete Python 3.11.
      - name: Set up Python 3.11 for the FVP
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache packs
        uses: actions/cache@v6
        with:
          key: cmsis-packs-${{ hashFiles('*.csolution.yml') }}
          path: /home/runner/.cache/arm/packs

      - name: Cache Vela venv
        uses: actions/cache@v6
        with:
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt', 'setup_venv.py') }}
          path: .venv

      - name: Create Vela venv
        run: ./setup_venv.sh

      - name: Generate the MLOps information
        run: cbuild setup ${SOLUTION}.csolution.yml --active ${TARGET} --packs --update-rte

      - name: Create the AI layer
        run: python3 create_ai_layer.py ${SOLUTION}.cbuild-mlops.yml

      - name: Build
        run: cbuild ${SOLUTION}.csolution.yml --active ${TARGET} --toolchain ${{ matrix.toolchain }}

      - name: Run on the FVP
        env:
          PYTHONHOME: ${{ env.pythonLocation }}
        run: |
          IMAGE=$(find out -name "${SOLUTION}.axf" -o -name "${SOLUTION}.elf" | head -1)
          echo "Running ${IMAGE}"
          FVP_Corstone_SSE-320 \
              -f board/Corstone-320/fvp_config.txt \
              -a "${IMAGE}" \
              --simlimit 60 --stat \
              | tee fvp_stdout.log

          echo "Checking simulation output"
          grep -q "MACs/cc:    256" fvp_stdout.log
          grep -q "Perform Inference (Ethos-U)" fvp_stdout.log
          grep -q "~~~ALL TESTS PASSED~~~" fvp_stdout.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corstone-320-${{ matrix.toolchain }}
          path: |
            fvp_stdout.log
            out/**/*.axf
            out/**/*.elf
            Model/

  # The Python side must work on all three host OSes. No FVP and no Arm
  # license needed, so this is cheap to matrix. The CPU fixture also covers
  # the CMSIS-NN variant of the generated layer.
  venv-cross-platform:
    name: Vela venv and CPU layer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Create Vela venv (POSIX)
        if: runner.os != 'Windows'
        run: ./setup_venv.sh

      - name: Create Vela venv (Windows)
        if: runner.os == 'Windows'
        run: .\setup_venv.bat

      - name: Generate the CPU variant of the AI layer
        shell: bash
        run: |
          mkdir -p tests/layer
          cp Model/model_int8.tflite Model/model_float.tflite tests/layer/
          python create_ai_layer.py tests/cpu.cbuild-mlops.yml
          grep -q 'Kernel&CMSIS-NN' tests/layer/model.clayer.yml
          grep -q 'model_int8_tflite_len = 3376' tests/layer/model_int8.c
          echo "CPU layer OK"
